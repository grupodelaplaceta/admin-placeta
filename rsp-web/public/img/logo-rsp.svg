<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="rspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3702b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a2be0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rspGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a1ec4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a44e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Círculo exterior -->
  <circle cx="200" cy="200" r="190" fill="url(#rspGrad)" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <!-- Anillo exterior decorativo -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <!-- Icono de red/conexión - nodos -->
  <circle cx="200" cy="130" r="22" fill="rgba(255,255,255,0.95)" />
  <circle cx="130" cy="230" r="22" fill="rgba(255,255,255,0.95)" />
  <circle cx="270" cy="230" r="22" fill="rgba(255,255,255,0.95)" />
  <circle cx="165" cy="290" r="18" fill="rgba(255,255,255,0.95)" />
  <circle cx="235" cy="290" r="18" fill="rgba(255,255,255,0.95)" />
  <!-- Líneas de conexión entre nodos -->
  <line x1="200" y1="152" x2="130" y2="208" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
  <line x1="200" y1="152" x2="270" y2="208" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
  <line x1="130" y1="252" x2="165" y2="272" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
  <line x1="270" y1="252" x2="235" y2="272" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
  <line x1="130" y1="230" x2="270" y2="230" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4" />
  <!-- Centro - icono de datos/database -->
  <circle cx="200" cy="175" r="40" fill="rgba(255,255,255,0.1)" />
  <rect x="182" y="162" width="36" height="26" rx="6" fill="rgba(255,255,255,0.9)" />
  <rect x="182" y="162" width="36" height="8" rx="3" fill="rgba(255,255,255,0.95)" />
  <line x1="188" y1="176" x2="212" y2="176" stroke="#3702b3" stroke-width="1.5" stroke-linecap="round" />
  <line x1="190" y1="181" x2="210" y2="181" stroke="#3702b3" stroke-width="1.5" stroke-linecap="round" />
  <!-- Letras RSP en el centro -->
  <text x="200" y="230" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="38" fill="white" letter-spacing="3">RSP</text>
  <text x="200" y="250" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="10" fill="rgba(255,255,255,0.7)" letter-spacing="4">SERVICIOS</text>
  <!-- Flecha conexión inferior -->
  <path d="M200 290 L200 310" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" />
  <circle cx="200" cy="318" r="4" fill="rgba(255,255,255,0.5)" />
</svg>
